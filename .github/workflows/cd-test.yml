name: CD Test Pipeline (build & push image)

# test/** 브랜치 push 시 커밋 SHA 태그로 이미지를 push 한다.
# 서버 배포는 하지 않는다 (Terraform + user-data 담당).
on:
  push:
    branches:
      - 'test/**'

jobs:
  build-and-push-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR
        run: |
          ./gradlew clean
          ./gradlew bootJar

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push image (tag = commit SHA)
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/docker-springboot:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/docker-springboot:${{ github.sha }}
